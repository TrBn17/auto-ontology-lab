[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "auto-ontology-lab"
version = "0.1.0"
description = "Evaluation and synthetic data lab for Auto-Ontology"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "psycopg[binary]>=3.1",
    "numpy>=1.26",
    "faker>=24.0",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
include = ["lab*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["lab"]
